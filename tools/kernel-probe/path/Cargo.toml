[package]
name = "kernel-path-probe"
version = "0.1.0"
edition = "2024"
publish = false

# This isolated workspace proves the path dependency without editing the app workspace.
[workspace]

[dependencies]
retrieval-kernel = { path = "../../../vendor/retrieval-kernel" }
tempfile = "3"

[lib]
name = "kernel_probe"
path = "../src/lib.rs"

[[bin]]
name = "kernel-path-probe"
path = "../src/main.rs"
