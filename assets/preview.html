<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src omni://app; style-src 'unsafe-inline'; img-src omni: data:; media-src omni:; object-src omni:; frame-src 'none'; connect-src 'none'; font-src 'none'; base-uri omni:; form-action 'none'">
{{BASE}}
<title>Omni Knowledge preview</title>
<style>
:root{color-scheme:light;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#28323f;background:#fafbf9}
body{margin:0;padding:28px 36px;overflow-wrap:anywhere}main{max-width:920px;margin:auto}h1,h2,h3{line-height:1.25;color:#1d3028}h1{font-size:30px}h2{border-bottom:1px solid #dce5de;padding-bottom:8px}a{color:#296445}img,video{max-width:100%;height:auto}audio{width:100%}object,embed{width:100%;height:calc(100vh - 64px);border:0}pre{overflow:auto;background:#edf1ee;border:1px solid #dce5de;border-radius:8px;padding:16px;line-height:1.5}code{font:13px/1.55 ui-monospace,Menlo,monospace}blockquote{border-left:3px solid #94ae9d;padding-left:18px;color:#5a695f}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border:1px solid #dce5de;padding:7px 11px;text-align:left}th{background:#edf1ee}.frontmatter{border:1px solid #dce5de;border-radius:8px;padding:12px 16px;margin-bottom:24px}.frontmatter summary{font-weight:600;color:#58715f;cursor:pointer}.mermaid{background:white;padding:16px;overflow:auto}.hljs-keyword,.hljs-selector-tag,.hljs-literal{color:#844bac}.hljs-string,.hljs-attr{color:#32785d}.hljs-number,.hljs-built_in{color:#b16836}.hljs-comment{color:#79847c}.hljs-title,.hljs-type{color:#276f92}.warning{color:#8b6230;font-size:13px}
.line-preview{margin:0 0 18px}.line-preview>summary{position:sticky;top:0;z-index:2;padding:7px 10px;border:1px solid #dce5de;border-radius:6px;background:#f0f5ee;color:#3f6a4d;cursor:pointer;font-size:13px}.line-preview[open]>summary{margin-bottom:12px}.line-preview[open]+.rendered-document{display:none}.line-view-hint{display:none;color:#6d7f71}.line-preview[open] .line-view-hint{display:inline}.line-origin{font-size:13px;color:#58715f}
.numbered-text{font:13px/1.65 ui-monospace,Menlo,monospace;border:1px solid #dce5de;border-radius:6px;overflow:hidden;background:#fff}.text-line{display:grid;grid-template-columns:var(--line-number-width,6ch) minmax(0,1fr);min-height:1.65em;scroll-margin-top:58px}.line-number{white-space:nowrap;box-sizing:border-box;min-width:0;padding:0 1ch;color:#7d8c81;text-align:right;border-right:1px solid #e4eae3;background:#f2f5ef;-webkit-user-select:none;user-select:none}.line-content{display:block;padding:0 12px;white-space:pre-wrap;overflow-wrap:anywhere;tab-size:4;min-height:1.65em}.text-line.is-search-hit{background:#e2efd9;box-shadow:inset 3px 0 #65975c}.text-line.is-search-hit>.line-number{color:#315c35;background:#d5e7c8;font-weight:600}
</style>
<script src="omni://app/vendor/highlight.min.js" defer></script>
<script src="omni://app/vendor/mermaid.min.js" defer></script>
<script src="omni://app/renderer.js" defer></script>
</head>
<body><main>{{CONTENT}}</main></body>
</html>
