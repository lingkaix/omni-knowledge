[package]
name = "omni-service"
version = "0.1.0"
edition = "2024"
description = "Versioned public knowledge-service wire DTOs and bounded JSON codec"
license = "Apache-2.0"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing"] }

[dev-dependencies]
tempfile = "3"
