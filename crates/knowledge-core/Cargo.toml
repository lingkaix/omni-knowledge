[package]
name = "knowledge-core"
version = "0.1.0"
edition = "2024"
description = "Pure mutable-manifest behavior and neutral mount-backend observations"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }
sha2 = "=0.10.9"
