[package]
name = "knowledge-package"
version = "0.1.0"
edition = "2024"
description = "Portable knowledge-package ZIP capture, preview, and staged restore"
license = "Apache-2.0"

[dependencies]
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
knowledge-core = { path = "../knowledge-core" }
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
sha2 = "=0.10.9"
unicode-normalization = "=0.1.25"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }
