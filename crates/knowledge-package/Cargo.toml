[package]
name = "knowledge-package"
version = "0.1.0"
edition = "2024"
description = "Portable knowledge-package ZIP capture, preview, and staged restore"
license = "Apache-2.0"

[dependencies]
crc32fast = "=1.5.2"
flate2 = "=1.1.10"
knowledge-core = { path = "../knowledge-core" }
pulldown-cmark = "=0.13.4"
serde_json = "=1.0.154"
serde_yaml = "=0.9.34"
serde_json_canonicalizer = "=0.4.1"
sha2 = "=0.10.9"
rustix = { version = "=1.1.5", features = ["fs"] }
unicode-normalization = "=0.1.25"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
anyhow = "=1.0.104"
knowledge-history = { path = "../knowledge-history" }
knowledge-processing = { path = "../knowledge-processing" }
knowledge-storage = { path = "../knowledge-storage" }

[dev-dependencies]
tar = "=0.4.46"
serde_json = "=1.0.154"
serde_json_canonicalizer = "=0.4.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }
