[package]
name = "knowledge-processing"
version = "0.1.0"
edition = "2024"
description = "Mature bounded extraction, EPUB, media, and local ASR adapters"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
ammonia = "4"
base64 = "0.22"
html2text = "0.16"
knowledge-core = { path = "../knowledge-core" }
mime_guess = "2"
pdf-extract = "0.12.1"
pulldown-cmark = "0.13"
roxmltree = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
url = "2"
walkdir = "2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.5", features = ["process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
