[package]
name = "knowledge-storage"
version = "0.1.0"
edition = "2024"
description = "Confined home installation, visible recovery journals, and bounded reconciliation"
license = "Apache-2.0"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
knowledge-history = { path = "../knowledge-history" }
knowledge-local = { path = "../knowledge-local" }
fs2 = "=0.4.3"
rustix = { version = "=1.1.5", features = ["fs", "process", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
uuid = { version = "=1.28.0", features = ["v4"] }
time = { version = "=0.3.55", features = ["formatting"] }

[dev-dependencies]
tempfile = "3"
