[package]
name = "knowledge-retrieval"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Admitted native adapter for the shared retrieval kernel"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
knowledge-package = { path = "../knowledge-package" }
tantivy = "0.26.2"
retrieval-kernel = { path = "../../vendor/retrieval-kernel" }
serde_json = "1"
# Existing pinned transitive type contract; no new package/version/feature closure.
ownedbytes = "=0.9.0"

[dev-dependencies]
knowledge-search = { path = "../knowledge-search" }
tempfile = "3"
sha2 = "0.10"
omni-service = { path = "../omni-service" }
rustix = { version = "1", features = ["fs"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
