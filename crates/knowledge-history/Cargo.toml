[package]
name = "knowledge-history"
version = "0.1.0"
edition = "2024"
description = "Operation-bound local Git transactions and inspectable recovery"
license = "Apache-2.0"

[dependencies]
knowledge-core = { path = "../knowledge-core" }
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
