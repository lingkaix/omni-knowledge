[package]
name = "knowledge-daemon"
version = "0.1.0"
edition = "2024"
description = "Bounded local daemon, CLI, and MCP transport for the frozen service codec"
license = "Apache-2.0"

[dependencies]
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
hyper = { version = "1.12", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["http1", "server", "tokio"] }
omni-service = { path = "../omni-service" }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
serde_json = "1"
