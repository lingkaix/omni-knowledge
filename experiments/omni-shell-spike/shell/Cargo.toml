[package]
name = "omni-shell-spike"
version = "0.1.0"
edition = "2024"
publish = false
description = "Isolated NSH window that hosts @openkit/knowledge-ui. Measurement only."
license = "Apache-2.0"

[workspace]

[dependencies]
env_logger = "0.11"
nsh-base = "=0.4.0"
nsh-core = "=0.4.0"
omni-shell-fake = { path = "../fake" }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.4.0", default-features = false, features = ["webview"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.4.0", default-features = false }
